apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: vllm
  labels:
    app.kubernetes.io/name: vllm
spec:
  # Default to 0 because TinyLlama-on-CPU doesn't fit in our 3.8GB nodes — the
  # container starts and validates config but OOMKills during model load (kubelet
  # evicts when memory request + actual usage exceeds node available + threshold).
  # Manifest is deliberately preserved as the gitapp source of truth; scale to 1
  # on nodes with >= 8GB memory:
  #   kubectl -n vllm scale deployment vllm --replicas=1
  # Or fix the fit on small nodes by switching to a pre-quantized INT8 model
  # (TinyLlama at int8 ~1.1GB, comfortably fits in the 3GB limit).
  replicas: 0
  strategy:
    type: Recreate   # CPU inference is RAM-heavy; avoid running two pods during rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      # vLLM startup time on CPU is long.
      # Keep the pod from being killed during init.
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.4.post1
          imagePullPolicy: IfNotPresent
          args:
            - "--model=TinyLlama/TinyLlama-1.1B-Chat-v1.0"
            - "--device=cpu"
            - "--dtype=float16"           # float32 = ~4.4GB for weights alone, won't fit in 3GB; float16 = ~2.2GB
            - "--swap-space=0"            # vLLM's internal "GPU spillover to CPU" buffer; default 4GB > our entire node, so disable
            - "--max-model-len=2048"      # cap context to keep RAM usage bounded
            - "--max-num-seqs=4"          # small batch — CPU can't sustain large concurrency
            - "--port=8000"
            - "--host=0.0.0.0"
          env:
            - name: VLLM_TARGET_DEVICE   # signals the build target if image supports it
              value: cpu
            - name: HF_HOME              # cache models in writable volume
              value: /cache/huggingface
            - name: HUGGING_FACE_HUB_CACHE
              value: /cache/huggingface
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              # Trimmed from 1 core because per-node CPU is already mostly committed
              # to control-plane + cilium + system pods on our 2-core droplets.
              # vLLM CPU inference for TinyLlama is RAM-bound, not CPU-bound, for
              # small batches — 250m schedulable + burst-to-2 is fine.
              cpu: 250m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi      # node has 3.8Gi total — leave headroom for the kernel
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120   # CPU model load is slow
            periodSeconds: 10
            failureThreshold: 60       # be patient — first load can take ~10 min
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 600   # don't kill while warming
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          emptyDir:
            sizeLimit: 5Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
