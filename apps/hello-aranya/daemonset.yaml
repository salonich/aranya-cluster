apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hello-aranya
  namespace: hello-aranya
  labels:
    app.kubernetes.io/name: hello-aranya
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-aranya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-aranya
    spec:
      hostNetwork: true                  # bind nginx directly to each node's NIC on port 80
      dnsPolicy: ClusterFirstWithHostNet # required when hostNetwork is true
      tolerations:                       # tolerate control-plane taint (we have stacked CP+W nodes)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: index-html
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]   # nginx needs these to bind :80 then drop to nginx user
      volumes:
        - name: index-html
          configMap:
            name: hello-aranya-index
            items:
              - key: index.html
                path: index.html
