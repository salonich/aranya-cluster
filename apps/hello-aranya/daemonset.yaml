apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hello-aranya
  namespace: hello-aranya
  labels:
    app.kubernetes.io/name: hello-aranya
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-aranya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-aranya
    spec:
      # hostNetwork: pod uses the node's network namespace, binds directly to the
      # host's NIC. Combined with hostPort: 80 below, every node becomes an entry
      # point on its own public IP. No Service, no NodePort, no ingress proxy.
      hostNetwork: true
      # ClusterFirstWithHostNet: still resolve in-cluster Service names via CoreDNS
      # even though we're on the host's network. We don't actually need cluster DNS
      # here (no in-cluster lookups), but this is the correct default to set with
      # hostNetwork — picks up if we ever do.
      dnsPolicy: ClusterFirstWithHostNet
      # All 3 nodes are stacked control-plane + worker. Recent kubespray removes the
      # control-plane NoSchedule taint when nodes are also workers, but the toleration
      # is cheap insurance.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
              # On hostNetwork, kubelet's HTTP probe targets the pod's IP (= host
              # IP). nginx listens on 0.0.0.0:80 so this resolves correctly.
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: index-html
              mountPath: /usr/share/nginx/html
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE: bind to privileged port 80
              # CHOWN/SETGID/SETUID: nginx drops privileges from root to the nginx
              # user after binding the port; needs these to chown its working dirs.
              add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
      volumes:
        - name: index-html
          configMap:
            name: hello-aranya-index
            items:
              - key: index.html
                path: index.html
